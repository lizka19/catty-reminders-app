name: CD

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: read

env:
  SSH_HOST: course.prafdin.space
  SSH_PORT: "3109"
  SSH_USER: password_123
  IMAGE_NAME: ghcr.io/lizka19/catty-reminders-app
  CONTAINER_NAME: catty-reminders-app

jobs:
  deploy:
    name: Deploy Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Prepare deployment variables
        run: |
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deployment SHA: $GITHUB_SHA" >&2
            exit 1
          fi
          echo "DEPLOY_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$IMAGE_NAME:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "REMOTE_DOCKER_CONFIG=/tmp/catty-docker-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Prepare SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/github_actions"
          chmod 600 "$HOME/.ssh/github_actions"
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Log in to GHCR on virtual machine
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GHCR_TOKEN"
          printf '%s' "$GHCR_TOKEN" |
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/github_actions" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              "$SSH_USER@$SSH_HOST" \
              "install -d -m 700 '$REMOTE_DOCKER_CONFIG' && DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' sudo docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy container
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/github_actions" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DEPLOY_SHA' '$IMAGE_REF' '$CONTAINER_NAME' '$REMOTE_DOCKER_CONFIG'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          DEPLOY_SHA="$1"
          IMAGE_REF="$2"
          CONTAINER_NAME="$3"
          DOCKER_CONFIG_DIR="$4"

          EXPECTED_IMAGE="ghcr.io/lizka19/catty-reminders-app:$DEPLOY_SHA"

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid deployment SHA: $DEPLOY_SHA" >&2
              exit 1
          fi

          if [[ "$IMAGE_REF" != "$EXPECTED_IMAGE" ]]; then
              echo "Unexpected image reference: $IMAGE_REF" >&2
              exit 1
          fi

          case "$DOCKER_CONFIG_DIR" in
              /tmp/catty-docker-*) ;;
              *) echo "Invalid Docker configuration path" >&2; exit 1 ;;
          esac

          export DOCKER_CONFIG="$DOCKER_CONFIG_DIR"

          echo "Pulling image: $IMAGE_REF"
          sudo docker pull "$IMAGE_REF"

          echo "Stopping previous containers on port 8181..."
          CONTAINERS_ON_PORT=$(sudo docker ps -q --filter "publish=8181" || true)
          if [[ -n "$CONTAINERS_ON_PORT" ]]; then
              echo "Containers on 8181: $CONTAINERS_ON_PORT"
              echo "$CONTAINERS_ON_PORT" | xargs -r sudo docker stop
              echo "$CONTAINERS_ON_PORT" | xargs -r sudo docker rm
          fi

          if sudo docker ps -a --format '{{.Names}}' | grep -qx "$CONTAINER_NAME"; then
              sudo docker stop "$CONTAINER_NAME" || true
              sudo docker rm "$CONTAINER_NAME" || true
          fi

          pkill -f '[u]vicorn app\.main:app' 2>/dev/null || true

          for _ in {1..10}; do
              if ! sudo lsof -i :8181 >/dev/null 2>&1; then
                  break
              fi
              echo "Waiting for port 8181 to be released..."
              sleep 1
          done

          if sudo lsof -i :8181 >/dev/null 2>&1; then
              echo "ERROR: Port 8181 still in use after stopping containers" >&2
              sudo lsof -i :8181 >&2
              exit 1
          fi

          echo "Starting new container from $IMAGE_REF"
          sudo docker run --detach \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --publish 8181:8181 \
              "$IMAGE_REF"

          for _ in {1..30}; do
              if ! sudo docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null | grep -qx true; then
                  echo "Container exited unexpectedly" >&2
                  sudo docker logs --tail 50 "$CONTAINER_NAME" >&2 || true
                  exit 1
              fi

              PAGE="$(curl --silent --fail --location http://127.0.0.1:8181/login || true)"
              if [[ "$PAGE" == *"content=\"$DEPLOY_SHA\""* ]]; then
                  echo "Deploy completed: $IMAGE_REF"
                  exit 0
              fi
              sleep 1
          done

          echo "Application did not become ready" >&2
          sudo docker logs --tail 50 "$CONTAINER_NAME" >&2 || true
          exit 1
          REMOTE_SCRIPT

      - name: Remove temporary registry credentials
        if: always()
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/github_actions" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" \
            "case '$REMOTE_DOCKER_CONFIG' in /tmp/catty-docker-*) rm -rf -- '$REMOTE_DOCKER_CONFIG' ;; esac" \
            || true

      - name: Remove SSH private key
        if: always()
        run: rm -f "$HOME/.ssh/github_actions"
