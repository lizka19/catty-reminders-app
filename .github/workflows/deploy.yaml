name: CD

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: read

env:
  SSH_HOST: course.prafdin.space
  SSH_PORT: "3109"
  SSH_USER: password_123
  APP_DIR: /home/password_123/Desktop/Catty/catty-reminders-app
  IMAGE_NAME: ghcr.io/lizka19/catty-reminders-app
  CONTAINER_NAME: catty-app

jobs:
  deploy:
    name: Deploy Docker Compose stack
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/github_actions"
          chmod 600 "$HOME/.ssh/github_actions"
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy via SSH
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_ACTOR: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | \
            ssh -p "$SSH_PORT" -i "$HOME/.ssh/github_actions" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" \
              "bash -s -- '$DEPLOY_SHA' '$IMAGE_NAME' '$APP_DIR' '$CONTAINER_NAME' '$GHCR_ACTOR'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          DEPLOY_SHA="$1"
          IMAGE_NAME="$2"
          APP_DIR="$3"
          CONTAINER_NAME="$4"
          GHCR_ACTOR="$5"

          read -r GHCR_TOKEN

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid deployment SHA: $DEPLOY_SHA" >&2
              exit 1
          fi

          if [[ ! -d "$APP_DIR" ]]; then
              echo "App dir not found: $APP_DIR" >&2
              exit 1
          fi

          cd "$APP_DIR"

          echo "Logging into GHCR as $GHCR_ACTOR..."
          printf '%s' "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

          echo "Generating .env for docker compose..."
          cat > .env <<EOF
          MARIADB_ROOT_PASSWORD=mypass
          MARIADB_DATABASE=catty_reminders
          MARIADB_USER=catty
          MARIADB_PASSWORD=cattypass
          HOST_DB_PORT=3306
          CONTAINER_DB_PORT=3306
          HOST_APP_PORT=8181
          CONTAINER_APP_PORT=8181
          IMAGE=${IMAGE_NAME}:${DEPLOY_SHA}
          APP_CONTAINER_NAME=${CONTAINER_NAME}
          DEPLOY_REF=${DEPLOY_SHA}
          EOF

          echo "Pulling image ${IMAGE_NAME}:${DEPLOY_SHA}..."
          sudo docker pull "${IMAGE_NAME}:${DEPLOY_SHA}"

          echo "Recreating compose stack..."
          sudo docker compose --env-file .env up -d --pull always --remove-orphans --force-recreate

          echo "Waiting for application to become ready with deployref=${DEPLOY_SHA}..."
          for _ in {1..30}; do
              PAGE="$(curl --silent --fail --location http://127.0.0.1:8181/login || true)"
              if [[ "$PAGE" == *"content=\"$DEPLOY_SHA\""* ]]; then
                  echo "Deploy completed: $DEPLOY_SHA"
                  exit 0
              fi
              sleep 2
          done

          echo "Application did not become ready" >&2
          sudo docker compose logs --tail 80 catty-app >&2 || true
          sudo docker compose logs --tail 80 db >&2 || true
          exit 1
          REMOTE_SCRIPT

      - name: Remove SSH private key
        if: always()
        run: rm -f "$HOME/.ssh/github_actions"
