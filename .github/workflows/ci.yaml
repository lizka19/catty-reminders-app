name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Run all tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run all tests and create report
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8181 > /tmp/catty-app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          curl --retry 10 --retry-connrefused --retry-delay 1 \
            --fail --silent http://127.0.0.1:8181/login > /dev/null

          python -m pytest -q --junitxml=test_result.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_result.xml
          if-no-files-found: error
